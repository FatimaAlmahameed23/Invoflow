name: invoflow
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.15.4
  flutter_bloc: ^9.1.1
  mobile_scanner: ^5.2.3

dev_dependencies:
